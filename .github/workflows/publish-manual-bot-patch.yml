# Temporary transport for a locally authored/tested patch, not a coding agent.
# Applies only on this feature branch and removes itself before the final commit.
name: Publish manually implemented bot patch
on:
  push:
    branches: [feat/manual-bot-controls-20260907]
    paths: [.automation/bot-controls.patch, .github/workflows/publish-manual-bot-patch.yml]
permissions:
  contents: write
jobs:
  apply-tested-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact patch and verify
        run: |
          git apply --check --unidiff-zero .automation/bot-controls.patch
          git apply --unidiff-zero .automation/bot-controls.patch
          node --check bot.js
          node --check bot-controls.js
          npm test
      - name: Commit implementation and remove temporary transport
        run: |
          git rm .automation/bot-controls.patch .github/workflows/publish-manual-bot-patch.yml
          git add bot.js Dockerfile package.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: wire slow broadcasts, browser switching, and randomized startup'
          git push origin HEAD:refs/heads/feat/manual-bot-controls-20260907
